<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Sepeda Motor</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0f0520; overflow: hidden; width: 100vw; height: 100vh; }
      #unity-container { width: 100%; height: 100%; }
      #unity-canvas { width: 100% !important; height: 100% !important; }
      #unity-loading-bar {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%); z-index: 200;
      }
      #unity-debug {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        max-height: 40vh;
        overflow: auto;
        z-index: 9999;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(20, 6, 28, 0.92);
        border: 1px solid rgba(255, 86, 86, 0.5);
        color: #ffd4d4;
        font: 12px/1.45 Consolas, monospace;
        white-space: pre-wrap;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="0"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <div id="unity-debug"></div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var debugBox = document.querySelector("#unity-debug");

      function showDebug(message) {
        debugBox.style.display = "block";
        debugBox.textContent += (debugBox.textContent ? "\n\n" : "") + String(message);
      }

      function formatError(error) {
        if (!error) return "Unknown error";
        if (typeof error === "string") return error;
        if (error.stack) return error.stack;
        if (error.message) return error.message;
        return JSON.stringify(error, null, 2);
      }

      function unityShowBanner(msg, type) {
        var wb = document.querySelector("#unity-warning");
        var div = document.createElement('div');
        div.innerHTML = msg;
        wb.appendChild(div);
        if (type == 'error') div.style = 'background:red;padding:10px;';
        else if (type == 'warning') {
          div.style = 'background:yellow;padding:10px;';
          setTimeout(() => { wb.removeChild(div); }, 5000);
        }
        wb.style.display = wb.children.length ? 'block' : 'none';
        if (type === 'error') showDebug(msg);
      }

      window.addEventListener('error', function(event) {
        showDebug("window.error\n" + formatError(event.error || event.message));
      });

      window.addEventListener('unhandledrejection', function(event) {
        showDebug("unhandledrejection\n" + formatError(event.reason));
      });

      var buildUrl = "Build";
      var config = {
        dataUrl:            buildUrl + "/Modul14.data",
        frameworkUrl:       buildUrl + "/Modul14.framework.js",
        codeUrl:            buildUrl + "/Modul14.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName:        "Akal Budi Bertumbuh",
        productName:        "Sepeda Motor",
        productVersion:     "0.1.0",
        showBanner:         unityShowBanner,
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = buildUrl + "/Modul14.loader.js";
      script.onerror = function() {
        showDebug("Gagal memuat loader Unity: " + script.src);
      };
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          window.unityInstance = unityInstance;
          canvas.focus();
          canvas.addEventListener('mouseenter', () => canvas.focus());
        }).catch((msg) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          unityShowBanner(String(msg), "error");
          showDebug("createUnityInstance gagal\n" + formatError(msg));
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
